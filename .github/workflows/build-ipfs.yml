name: Build IPFS shell

on:
  workflow_dispatch:
  repository_dispatch:
    types: [publish]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm i --no-save viem

      - run: npm run build:ipfs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_API_BASE: https://merch-and-memes.vercel.app
          NEXT_PUBLIC_SITE_URL: https://merchandmemes.eth.limo

      - name: Upload shell to Filebase
        run: node scripts/upload-ipfs.mjs
        env:
          FILEBASE_ACCESS_KEY_ID: ${{ secrets.FILEBASE_ACCESS_KEY_ID }}
          FILEBASE_SECRET_ACCESS_KEY: ${{ secrets.FILEBASE_SECRET_ACCESS_KEY }}
          FILEBASE_BUCKET_NAME: ${{ secrets.FILEBASE_SHELL_BUCKET }}

      - name: Generate bucket CID
        id: cid
        run: node scripts/bucket-cid.mjs
        env:
          FILEBASE_ACCESS_KEY_ID: ${{ secrets.FILEBASE_ACCESS_KEY_ID }}
          FILEBASE_SECRET_ACCESS_KEY: ${{ secrets.FILEBASE_SECRET_ACCESS_KEY }}
          FILEBASE_BUCKET_NAME: ${{ secrets.FILEBASE_SHELL_BUCKET }}

      - name: Point ENS at the new CID
        run: node scripts/set-contenhash.mjs
        env:
          CID: ${{ steps.cid.outputs.cid }}
          ENS_NAME: ${{ secrets.ENS_NAME }}
          ENS_RPC_URL: ${{ secrets.ENS_RPC_URL }}
          ENS_UPDATER_PRIVATE_KEY: ${{ secrets.ENS_UPDATER_PRIVATE_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: ipfs-shell
          path: out
          retention-days: 7
